<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - Asociadas</title>
    <style>
        * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 🔹 Contenedor del formulario con fondo verde pálido */
        .formulario-edicion {
            background: rgba(240, 253, 244, 0.98);
            padding: 1.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #bbf7d0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        .formulario-edicion h3 { margin-bottom: 1.4rem; color: #166534; text-align: center; }
        /* 🔹 Cuadrícula: 2 columnas en pantallas grandes, 1 en pequeñas */
        .grid-campos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.8rem 1.5rem;
            align-items: center;
        }
        /* 🔹 Grupo de campo: etiqueta + entrada */
        .grupo-campo {
            display: flex;
            flex-direction: column;
        }
        .grupo-campo label {
            font-size: 0.85rem;
            color: #14532d;
            margin-bottom: 0.25rem;
        }
        /* 🔹 Anchos calculados según contenido */
        input, select {
            padding: 0.65rem 0.8rem;
            border: 1px solid #86efac;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
            background: #ffffff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }
        input:disabled { background: #f0fdf4; color: #166534; cursor: not-allowed; }
        /* 🔹 Campos que ocupan AMBAS columnas */
        .campo-ancho {
            grid-column: 1 / -1;
        }
        /* 🔹 Checkbox personalizado */
        .contenedor-checkbox {
            display: flex;
            align-items: center;
            padding: 0.4rem 0;
            gap: 0.5rem;
        }
        .contenedor-checkbox input[type="checkbox"] {
            width: auto;
            transform: scale(1.2);
            margin: 0;
        }
        /* 🔹 Botones del formulario */
        .contenedor-botones {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.4rem;
            justify-content: center;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.7rem 1.5rem;
            min-width: 120px;
        }
        button:hover { background: #16a34a; }
        button:disabled { background: #86efac; cursor: not-allowed; opacity: 0.7; }
        button.volver { background: #64748b; }
        button.volver:hover { background: #475569; }
        /* 🔹 Estilos generales de página */
        button.eliminar { background: #dc2626; padding: 0.5rem 1rem; }
        button.eliminar:hover { background: #b91c1c; }
        button.editar { background: #f59e0b; padding: 0.5rem 1rem; margin-right: 0.3rem; }
        button.editar:hover { background: #d97706; }
        button.agregar-alimento { background: #22c55e; padding: 0.5rem 1rem; font-size: 0.85rem; margin-left: 0.5rem; }
        button.agregar-alimento:hover { background: #16a34a; }
        button.quitar { background: #ef4444; padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 4px; }
        button.quitar:hover { background: #dc2626; }
        .boton-nuevo { margin: 1rem 0; width: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 0.6rem; text-align: left; font-size: 0.82rem; }
        th { background: #f3f4f6; color: #1e293b; font-weight: bold; }
        .acciones { width: 120px; text-align: center; }
        .seccion-alimentos {
            background: rgba(240, 253, 244, 0.98);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
            border: 1px solid #bbf7d0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        .seccion-alimentos h3 { margin-bottom: 1rem; color: #166534; text-align: center; }
        .agregar-nuevo {
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid #bbf7d0;
            margin-bottom: 1.2rem;
        }
        .agregar-nuevo h4 { margin-bottom: 0.5rem; color: #166534; }
        .caja-asociados {
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid #bbf7d0;
        }
        .caja-asociados h4 { margin-bottom: 0.8rem; color: #166534; }
        .selector-alimento { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .selector-alimento select { flex: 1; min-width: 250px; margin: 0; }
        .error { color: #dc2626; margin: 1rem 0; font-weight: bold; }
        .exito { color: #166534; margin: 1rem 0; font-weight: bold; }
        .info { color: #15803d; margin: 0.5rem 0; font-size: 0.9rem; }
        .sin-registros { color: #166534; font-style: italic; text-align: center; padding: 1.5rem; }
        body {
            margin: 0;
            padding: 0;
            position: relative;
            min-height: 100vh;
            background-color: #f0f4f8;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url('https://images.unsplash.com/photo-1556911220-bff31c812dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(1px);
        }
        #app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 95%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        #datos, #cargando {
            background: rgba(255, 255, 255, 0.96);
            padding: 2rem;
            border-radius: 12px;
            margin-top: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            box-sizing: border-box;
        }
        .encabezado-pagina {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .encabezado-pagina h2 {
            flex: 1;
            text-align: center;
            padding-right: 100px;
            color: #166534;
        }
        #contenedorTabla { transition: opacity 0.2s ease; }
    </style>
</head>
<body>
    <div id="app">
        <div id="cargando">🔐 Verificando sesión...</div>
        
        <div id="datos" style="display: none;">
            <div class="encabezado-pagina">
                <button type="button" class="volver" onclick="window.location.href='index.html'">← Volver</button>
                <h2>Gestión de Empresas</h2>
            </div>
            
            <!-- ✅ FORMULARIO CON FONDO VERDE PÁLIDO -->
            <div id="formularioEmpresa" class="formulario-edicion" style="display: none;">
                <h3 id="tituloForm">Nueva Empresa</h3>
                
                <div class="grid-campos">
                    <!-- Fila 1: NIT + Fecha -->
                    <div class="grupo-campo">
                        <label for="empresaNit">NIT (Clave única) *</label>
                        <input type="text" id="empresaNit" placeholder="ej. 1234567-8" required maxlength="20">
                    </div>
                    <div class="grupo-campo">
                        <label for="empresaRegistro">Fecha de Registro</label>
                        <input type="date" id="empresaRegistro" required disabled>
                    </div>
                    <!-- Fila 2: Nombres (ancho completo) -->
                    <div class="grupo-campo campo-ancho">
                        <label for="empresaNombreLegal">Nombre Legal *</label>
                        <input type="text" id="empresaNombreLegal" placeholder="Nombre completo de la empresa" required>
                    </div>
                    <div class="grupo-campo campo-ancho">
                        <label for="empresaNombreComercial">Nombre Comercial</label>
                        <input type="text" id="empresaNombreComercial" placeholder="Nombre comercial o marca">
                    </div>
                    <!-- Fila 3: Contacto + Correo -->
                    <div class="grupo-campo">
                        <label for="empresaContacto">Contacto Principal</label>
                        <input type="text" id="empresaContacto" placeholder="Nombre y teléfono">
                    </div>
                    <div class="grupo-campo">
                        <label for="correoRepresentante">Correo del Representante *</label>
                        <input type="email" id="correoRepresentante" placeholder="correo@ejemplo.com" required>
                    </div>
                    <!-- Fila 4: Banco + Tipo de Cuenta -->
                    <div class="grupo-campo">
                        <label for="banco">Nombre del Banco *</label>
                        <input type="text" id="banco" placeholder="ej. Banco Industrial" required>
                    </div>
                    <div class="grupo-campo">
                        <label for="tipoCuenta">Tipo de Cuenta *</label>
                        <select id="tipoCuenta" required>
                            <option value="">Seleccione...</option>
                            <option value="Monetaria">Cuenta Monetaria</option>
                            <option value="Ahorra">Cuenta de Ahorros</option>
                        </select>
                    </div>
                    <!-- Fila 5: Número de Cuenta (AHORA OBLIGATORIO) -->
                    <div class="grupo-campo">
                        <label for="numeroCuenta">Número de Cuenta (máx. 20) *</label>
                        <input type="text" id="numeroCuenta" placeholder="000-000000-0" maxlength="20" required>
                    </div>
                    <!-- Checkbox: Vigente -->
                    <div class="contenedor-checkbox">
                        <input type="checkbox" id="empresaVigente" checked disabled>
                        <label for="empresaVigente">✅ Empresa Vigente</label>
                    </div>
                </div>
                <!-- Botones -->
                <div class="contenedor-botones">
                    <button id="btnGuardar" onclick="guardarEmpresa()">Guardar</button>
                    <button class="volver" onclick="cancelarFormulario()">Cancelar</button>
                </div>
            </div>
            <button id="botonNueva" class="boton-nuevo" onclick="abrirFormularioNuevo()">➕ Nueva Empresa</button>
            
            <div id="contenedorTabla">
                <div id="mensajeDatos"></div>
                <div id="tablaEmpresa"></div>
            </div>
            <!-- Sección Alimentos -->
            <div id="seccionAlimentos" class="seccion-alimentos" style="display: none;">
                <h3>🥗 Alimentos Asociados — NIT: <span id="nitSeleccionado"></span></h3>
                <div class="agregar-nuevo">
                    <h4>➕ Asociar nuevo tipo de alimento</h4>
                    <div class="selector-alimento">
                        <select id="alimentoDisponible">
                            <option value="">-- Seleccione un alimento del catálogo --</option>
                        </select>
                        <button class="agregar-alimento" onclick="asociarAlimento()">Asociar</button>
                    </div>
                </div>
                <div class="caja-asociados">
                    <h4>📋 Tipos de alimento que ya tiene asociados:</h4>
                    <div id="tablaAlimentosAsociados">
                        <p class="sin-registros">Cargando...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 🔑 Conexión a Supabase (se mantiene para guardar, editar, eliminar)
        const supabaseUrl = 'https://swwodfpirqvwliuiswup.supabase.co';
        const supabaseKey = "sb_publishable_FKCzw_BciB92cN3VNFLevA_rz49uq-q";
        const clienteSupabase = supabase.createClient(supabaseUrl, supabaseKey, {
            auth: { storage: localStorage, autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
        });

        // ✅ === NUEVA CONEXIÓN A TU BACKEND EN RENDER ===
        const API_BASE = "https://paquetesorpresa.onrender.com/api";

        let nitActual = null;
        let fechaRegistroAuto = "";

        // ✅ Fecha de hoy según zona Guatemala
        function obtenerFechaHoy() {
            const hoy = new Date();
            const guate = new Date(hoy.getTime() - 6 * 60 * 60 * 1000);
            return guate.toISOString().split('T')[0];
        }

        async function iniciarSesionAutomatica() {
            try {
                const { data: { session } } = await clienteSupabase.auth.getSession();
                if (!session) {
                    document.getElementById('cargando').innerHTML = `<p class="error">🔒 Sesión no iniciada. Redirigiendo...</p>`;
                    setTimeout(() => window.location.href = 'index.html', 2000);
                    return;
                }
                mostrarSistema();
            } catch (err) {
                document.getElementById('cargando').innerHTML = `<p class="error">❌ Error de conexión: ${err.message}</p>`;
                console.error("Fallo:", err);
            }
        }

        function mostrarSistema() {
            document.getElementById('cargando').style.display = 'none';
            document.getElementById('datos').style.display = 'block';
            cargarTablaEmpresa();
        }

        function abrirFormularioNuevo() {
            document.getElementById('tituloForm').textContent = "Nueva Empresa";
            document.getElementById('empresaNit').value = "";
            document.getElementById('empresaNit').disabled = false;
            document.getElementById('empresaNombreLegal').value = "";
            document.getElementById('empresaNombreComercial').value = "";
            
            fechaRegistroAuto = obtenerFechaHoy();
            document.getElementById('empresaRegistro').value = fechaRegistroAuto;
            
            document.getElementById('empresaContacto').value = "";
            document.getElementById('empresaVigente').checked = true;
            document.getElementById('empresaVigente').disabled = true;
            document.getElementById('correoRepresentante').value = "";
            document.getElementById('banco').value = "";
            document.getElementById('tipoCuenta').value = "";
            document.getElementById('numeroCuenta').value = "";
            
            document.getElementById('contenedorTabla').style.display = 'none';
            document.getElementById('botonNueva').style.display = 'none';
            document.getElementById('formularioEmpresa').style.display = 'block';
            document.getElementById('mensajeDatos').innerHTML = "";
            document.getElementById('seccionAlimentos').style.display = 'none';
            nitActual = null;
        }

        async function abrirFormularioEditar(nit) {
            document.getElementById('tituloForm').textContent = "Editar Empresa";
            document.getElementById('contenedorTabla').style.display = 'none';
            document.getElementById('botonNueva').style.display = 'none';
            
            const { data, error } = await clienteSupabase.from("Empresa").select('*').eq('NIT', nit).single();
            if (error) return alert("Error al cargar: " + error.message);
            
            document.getElementById('empresaNit').value = data.NIT;
            document.getElementById('empresaNit').disabled = true;
            document.getElementById('empresaNombreLegal').value = data["Nombre Legal"] || "";
            document.getElementById('empresaNombreComercial').value = data["Nombre Comercial"] || "";
            
            fechaRegistroAuto = data.Registro || obtenerFechaHoy();
            document.getElementById('empresaRegistro').value = fechaRegistroAuto;
            
            document.getElementById('empresaVigente').checked = data.Vigente;
            document.getElementById('empresaVigente').disabled = false;
            document.getElementById('correoRepresentante').value = data.correorepresentante || "";
            document.getElementById('banco').value = data.banco || "";
            document.getElementById('tipoCuenta').value = data.tipocta || "";
            document.getElementById('numeroCuenta').value = data.cuenta || "";
            document.getElementById('formularioEmpresa').style.display = 'block';
            document.getElementById('mensajeDatos').innerHTML = "";
            nitActual = nit;
            document.getElementById('nitSeleccionado').textContent = nit;
            document.getElementById('seccionAlimentos').style.display = 'block';
            await cargarAlimentosDisponibles();
            await cargarAlimentosAsociados();
        }

        function cancelarFormulario() {
            document.getElementById('formularioEmpresa').style.display = 'none';
            document.getElementById('empresaNit').disabled = false;
            document.getElementById('seccionAlimentos').style.display = 'none';
            document.getElementById('contenedorTabla').style.display = 'block';
            document.getElementById('botonNueva').style.display = 'inline-block';
            nitActual = null;
            fechaRegistroAuto = "";
        }

        async function guardarEmpresa() {
            const btnGuardar = document.getElementById('btnGuardar');
            btnGuardar.disabled = true;
            btnGuardar.textContent = "Guardando...";
            try {
                const nit = document.getElementById('empresaNit').value.trim();
                const correo = document.getElementById('correoRepresentante').value.trim();
                const numeroCuenta = document.getElementById('numeroCuenta').value.trim();
                
                // ✅ Validaciones
                if (!nit) throw new Error("⚠️ El NIT es obligatorio");
                if (!document.getElementById('empresaNombreLegal').value.trim()) {
                    throw new Error("⚠️ El Nombre Legal es obligatorio");
                }
                if (!correo.includes('@')) throw new Error("⚠️ El correo debe contener el carácter @");
                if (!document.getElementById('banco').value.trim()) {
                    throw new Error("⚠️ El nombre del Banco es obligatorio");
                }
                if (!document.getElementById('tipoCuenta').value) {
                    throw new Error("⚠️ Debe seleccionar el Tipo de Cuenta");
                }
                if (!numeroCuenta) {
                    throw new Error("⚠️ El Número de Cuenta es obligatorio");
                }
                if (numeroCuenta.length > 20) {
                    throw new Error("⚠️ El Número de Cuenta no puede exceder 20 caracteres");
                }
                const datos = {
                    "NIT": nit,
                    "Nombre Legal": document.getElementById('empresaNombreLegal').value.trim(),
                    "Nombre Comercial": document.getElementById('empresaNombreComercial').value.trim(),
                    "Registro": fechaRegistroAuto,
                    "Contacto Principal": document.getElementById('empresaContacto').value.trim(),
                    "Vigente": document.getElementById('empresaVigente').checked,
                    "correorepresentante": correo,
                    "banco": document.getElementById('banco').value.trim(),
                    "tipocta": document.getElementById('tipoCuenta').value,
                    "cuenta": numeroCuenta
                };
                let respuesta;
                if (document.getElementById('empresaNit').disabled) {
                    if (!confirm("¿Guardar cambios en esta empresa?")) return;
                    respuesta = await clienteSupabase.from("Empresa").update(datos).eq('NIT', nit);
                } else {
                    respuesta = await clienteSupabase.from("Empresa").insert([datos]);
                }
                if (respuesta.error) {
                    if (respuesta.error.code === '23505') throw new Error("El NIT ya está registrado");
                    if (respuesta.error.code === '23514') {
                        if (respuesta.error.message.includes('chk_correo_arroba')) throw new Error("El correo debe contener @");
                        if (respuesta.error.message.includes('chk_tipocta_valido')) throw new Error("Tipo de cuenta inválido. Use 'Monetaria' o 'Ahorra'");
                    }
                    throw respuesta.error;
                }
                alert(document.getElementById('empresaNit').disabled 
                    ? "✅ Actualizado correctamente" 
                    : "✅ Creado correctamente");
                cancelarFormulario();
                cargarTablaEmpresa();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Guardar";
            }
        }

        async function eliminarEmpresa(nit) {
            if (!confirm(`⚠️ ¿Eliminar empresa con NIT: ${nit}?\nSe eliminarán también sus alimentos asociados.`)) return;
            const { error: errRel } = await clienteSupabase.from("empresalimento").delete().eq('nit', nit);
            if (errRel) return alert("Error al desvincular alimentos: " + errRel.message);
            
            const { error } = await clienteSupabase.from("Empresa").delete().eq('NIT', nit);
            if (error) return alert("Error al eliminar: " + error.message);
            alert("✅ Eliminado correctamente");
            cancelarFormulario();
            cargarTablaEmpresa();
        }

        // ✅ === FUNCIÓN MODIFICADA: Ahora lee desde tu Backend en Render ===
        async function cargarTablaEmpresa() {
            const tablaDiv = document.getElementById('tablaEmpresa');
            const msgDiv = document.getElementById('mensajeDatos');
            msgDiv.innerHTML = '<p class="info">Cargando datos desde el servidor...</p>';
            tablaDiv.style.opacity = '0.5';

            try {
                // 📞 Llamada a tu API en Render en lugar de directo a Supabase

		const respuesta = await fetch(`${API_BASE}/public/empresas`);
                const resultado = await respuesta.json();
                const data = resultado.datos;

                if (!data || data.length === 0) {
                    msgDiv.innerHTML = `<p class="info">No hay empresas registradas</p>`;
                    tablaDiv.innerHTML = "";
                    return;
                }

                msgDiv.innerHTML = `<p class="exito">Total: ${data.length} empresas</p>`;
                let html = `
                <table>
                    <thead>
                        <tr>
                            <th>NIT</th>
                            <th>Nombre Legal</th>
                            <th>Nombre Comercial</th>
                            <th>Fecha Registro</th>
                            <th>Contacto</th>
                            <th>Correo Representante</th>
                            <th>Banco</th>
                            <th>Tipo Cuenta</th>
                            <th>N° Cuenta</th>
                            <th>Vigente</th>
                            <th class="acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>`;
                data.forEach(emp => {
                    html += `
                    <tr>
                        <td>${emp.NIT}</td>
                        <td>${emp["Nombre Legal"]}</td>
                        <td>${emp["Nombre Comercial"] || '-'}</td>
                        <td>${emp.Registro}</td>
                        <td>${emp["Contacto Principal"] || '-'}</td>
                        <td>${emp.correorepresentante || '-'}</td>
                        <td>${emp.banco || '-'}</td>
                        <td>${emp.tipocta || '-'}</td>
                        <td>${emp.cuenta || '-'}</td>
                        <td>${emp.Vigente ? '✅ Sí' : '❌ No'}</td>
                        <td class="acciones">
                            <button class="editar" onclick="abrirFormularioEditar('${emp.NIT}')">Editar</button>
                            <button class="eliminar" onclick="eliminarEmpresa('${emp.NIT}')">X</button>
                        </td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                tablaDiv.innerHTML = html;
            } catch (err) {
                msgDiv.innerHTML = `<p class="error">Error: ${err.message}</p>`;
                console.error("Detalle del error:", err);
            } finally {
                tablaDiv.style.opacity = '1';
            }
        }

        async function cargarAlimentosDisponibles() {
            try {
                const { data: todos, error: errTodos } = await clienteSupabase
                    .from("alimento")
                    .select("secuencia, variedad")
                    .order("variedad", { ascending: true });
                if (errTodos) throw errTodos;
                const { data: asociados, error: errAsoc } = await clienteSupabase
                    .from("empresalimento")
                    .select("secuencia")
                    .eq("nit", nitActual);
                if (errAsoc) throw errAsoc;
                const idsAsociados = (asociados || []).map(a => a.secuencia);
                const disponibles = (todos || []).filter(a => !idsAsociados.includes(a.secuencia));
                const select = document.getElementById("alimentoDisponible");
                select.innerHTML = `<option value="">-- Seleccione un alimento del catálogo --</option>`;
                disponibles.forEach(a => {
                    select.innerHTML += `<option value="${a.secuencia}">${a.variedad}</option>`;
                });
            } catch (err) {
                console.error("Error al cargar alimentos:", err.message);
            }
        }

        async function cargarAlimentosAsociados() {
            const div = document.getElementById("tablaAlimentosAsociados");
            try {
                const { data: relaciones, error: errRel } = await clienteSupabase
                    .from("empresalimento")
                    .select("secuencia")
                    .eq("nit", nitActual);
                if (errRel) throw errRel;
                if (!relaciones || relaciones.length === 0) {
                    div.innerHTML = `<p class="sin-registros">📋 Esta empresa aún no tiene alimentos asociados.</p>`;
                    return;
                }
                const { data: todosAlimentos, error: errAlim } = await clienteSupabase
                    .from("alimento")
                    .select("secuencia, variedad");
                if (errAlim) throw errAlim;
                const mapaAlimentos = {};
                todosAlimentos.forEach(a => {
                    mapaAlimentos[a.secuencia] = a.variedad;
                });
                let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Variedad / Tipo de Alimento</th>
                            <th style="width: 100px; text-align: center;">Acción</th>
                        </tr>
                    </thead>
                    <tbody>`;
                relaciones.forEach(rel => {
                    const variedad = mapaAlimentos[rel.secuencia] || 'Desconocido';
                    html += `
                    <tr>
                        <td>${variedad}</td>
                        <td style="text-align: center;">
                            <button class="quitar" onclick="quitarAlimento(${rel.secuencia})">❌ Quitar</button>
                        </td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                div.innerHTML = html;
            } catch (err) {
                div.innerHTML = `<p class="error">Error: ${err.message}</p>`;
            }
        }

        async function asociarAlimento() {
            const secuencia = parseInt(document.getElementById("alimentoDisponible").value);
            if (!secuencia) return alert("Seleccione un alimento");
            try {
                const { error } = await clienteSupabase
                    .from("empresalimento")
                    .insert({ nit: nitActual, secuencia: secuencia });
                if (error) {
                    if (error.code === '23505') throw new Error("Este alimento ya está asociado a la empresa");
                    throw error;
                }
                alert("✅ Alimento asociado correctamente");
                await cargarAlimentosDisponibles();
                await cargarAlimentosAsociados();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        async function quitarAlimento(secuencia) {
            if (!confirm("⚠️ ¿Quitar este alimento de la empresa?")) return;
            try {
                const { error } = await clienteSupabase
                    .from("empresalimento")
                    .delete()
                    .eq("nit", nitActual)
                    .eq("secuencia", secuencia);
                if (error) throw error;
                alert("✅ Alimento desasociado");
                await cargarAlimentosDisponibles();
                await cargarAlimentosAsociados();
            } catch (err) {
                alert("Error al quitar: " + err.message);
            }
        }

        window.addEventListener('load', iniciarSesionAutomatica);
    </script>
</body>
</html>
