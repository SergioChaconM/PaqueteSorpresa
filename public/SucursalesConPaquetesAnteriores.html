<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paquetes por Empresa y Sucursal Anteriores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: url('https://swwodfpirqvwliuiswup.supabase.co/storage/v1/object/public/Imagenes/cocina3.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(102, 126, 234, 0.15);
            z-index: -1;
        }
        .cabecera {
            background: rgba(255, 255, 255, 0.95);
            color: #2d3748;
            padding: 24px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }
        .cabecera h1 {
            font-size: 26px;
            color: #2d3748;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .cabecera p {
            font-size: 16px;
            color: #6b7280;
        }
        #fechaHoy {
            font-weight: bold;
            color: #667eea;
        }
        .contenedor-tabla {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto;
        }
        .fila {
            display: grid;
            grid-template-columns: 2fr 2fr 140px 110px;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e7eb;
            align-items: center;
            font-size: 15px;
        }
        .fila-encabezado {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 700;
            font-size: 14px;
            border-bottom: none;
        }
        .fila-datos:nth-child(even) {
            background-color: rgba(249, 250, 251, 0.8);
        }
        .fila-datos:hover {
            background-color: rgba(243, 244, 246, 0.9);
        }
        .col-nombre {
            font-weight: 600;
            color: #1f2937;
        }
        .col-nombre.oculto {
            color: transparent;
            font-weight: normal;
        }
        .col-ubicacion {
            color: #4b5563;
            font-size: 14px;
        }
        .col-cantidad {
            text-align: right;
        }
        .etiqueta-cantidad {
            display: inline-block;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #742a2a;
            padding: 8px 18px;
            border-radius: 24px;
            font-weight: bold;
            font-size: 16px;
        }
        .col-enlace {
            text-align: center;
        }
        .btn-ver {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-ver:hover {
            transform: scale(1.05);
        }
        .centro {
            text-align: center;
            padding: 60px 20px;
            color: #2d3748;
            font-size: 18px;
        }
        .error {
            background: rgba(254, 178, 178, 0.95);
            color: #742a2a;
            padding: 24px;
            border-radius: 12px;
            font-weight: bold;
        }
        .aviso {
            background: rgba(251, 243, 219, 0.95);
            color: #975a16;
            padding: 24px;
            border-radius: 12px;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            .fila {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 14px 16px;
            }
            .fila-encabezado { display: none; }
            .fila-datos {
                border-bottom: 2px solid #e5e7eb;
            }
            .col-cantidad { text-align: left; margin-top: 4px; }
        }
    </style>
</head>
<body>
    <div class="cabecera">
        <h1>📋 Resumen de Paquetes por Empresa y Ubicación Anteriores</h1>
        <p>Fecha de Hoy: <span id="fechaHoy"></span></p>
    </div>
    <div id="contenedor">
        <p class="centro">Cargando registros...</p>
    </div>

<script>
    // 🔗 API — SIN credenciales expuestas 🔒
    const API_BASE = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
        ? "http://127.0.0.1:8000/api"
        : "/api";

    async function cargar() {
        const contenedor = document.getElementById('contenedor');
        
        try {
            const res = await fetch(`${API_BASE}/sucursales-con-paquetes-anteriores`);
            if (!res.ok) throw new Error(`Error ${res.status}`);
            
            const { datos, fecha_hoy } = await res.json();
            document.getElementById('fechaHoy').textContent = fecha_hoy;

            if (!datos || datos.length === 0) {
                contenedor.innerHTML = `<p class="centro aviso">📭 No hay paquetes anteriores a hoy sin comprar</p>`;
                return;
            }

            let html = `
            <div class="contenedor-tabla">
                <div class="fila fila-encabezado">
                    <div>🏢 Empresa</div>
                    <div>📍 Ubicación</div>
                    <div>📦 Total Paquetes</div>
                    <div>Ver</div>
                </div>`;
            
            let nombreAnterior = "";
            datos.forEach(grupo => {
                const claseOcultar = grupo.nombre_comercial === nombreAnterior ? "oculto" : "";
                const nombreAMostrar = grupo.nombre_comercial;
                
                const enlaceDetalle = `PaquetesDe1Sucursal.html?NIT=${encodeURIComponent(grupo.nit)}&Sucursal=${encodeURIComponent(grupo.sucursal)}`;
                
                html += `
                <div class="fila fila-datos">
                    <div class="col-nombre ${claseOcultar}">${nombreAMostrar}</div>
                    <div class="col-ubicacion">${grupo.localizacion}</div>
                    <div class="col-cantidad">
                        <span class="etiqueta-cantidad">${grupo.total_paquetes}</span>
                    </div>
                    <div class="col-enlace">
                        <a class="btn-ver" href="${enlaceDetalle}">Ver →</a>
                    </div>
                </div>`;
                nombreAnterior = grupo.nombre_comercial;
            });
            
            html += `</div>`;
            contenedor.innerHTML = html;
            
            console.log(`✅ Grupos formados: ${datos.length}`);
        } catch (err) {
            contenedor.innerHTML = `<p class="centro error">❌ ${err.message}</p>`;
            console.error("❌ Error:", err);
        }
    }

    document.addEventListener('DOMContentLoaded', cargar);
</script>
</body>
</html>
